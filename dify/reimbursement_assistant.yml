    - data:
        instruction: 今天是 {{#today.today#}}。从用户问题中提取出差信息，用于报销金额计算。日期一律写成 YYYY-MM-DD；用户没写年份时按今天所在年份。只提取用户明确说出的信息，不要猜测。
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        parameters:
        - description: 用户是否要求计算具体的报销金额（住宿费、伙食补助、市内交通费中的任意一项）。只问标准、不给具体行程的，填 no。
          name: is_calculation
          options:
          - 'yes'
          - 'no'
          required: true
          type: select
        - description: 出差目的地城市名，例如 北京、杭州、绍兴
          name: city
          required: false
          type: string
        - description: 出差第一天，YYYY-MM-DD
          name: start
          required: false
          type: string
        - description: 出差最后一天，YYYY-MM-DD
          name: end
          required: false
          type: string
        - description: 每晚住宿的入住日期和房价，格式 日期:金额，多晚用分号分隔，例如 2026-10-12:600;2026-10-13:600。没有给房价则留空。
          name: nights
          required: false
          type: string
        - description: 接待单位安排用餐的日期，格式 日期:full 或 日期:partial（full=统一安排全天用餐，partial=只安排部分餐次），多天用分号分隔。没有则留空。
          name: meals_provided
          required: false
          type: string
