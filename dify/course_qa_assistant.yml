    - data:
        code: "\"\"\"Guard for the course app's hint branch (pasted into the Dify\
          \ code node \"拦截完整代码\").\n\nHides code a student could hand in as is. Code\
          \ counts whether or not the model put it\nin ``` fences: three or more consecutive\
          \ Python-looking lines are treated as a block.\n\"\"\"\n\nimport re\n\n\
          FENCED = re.compile(r\"```[a-zA-Z]*[ \\t]*\\n(.*?)```\", re.S)  # models\
          \ sometimes add trailing spaces\nBLANK = re.compile(r\"_{3,}|TODO|\\.\\\
          .\\.|…\")\nPY_LINE = re.compile(\n    r\"^\\s*(?:[A-Za-z_][\\w\\[\\]\\.]*\\\
          s*(?:=|\\+=|-=|\\*=|/=)(?!=)|while\\b|for\\b|if\\b|elif\\b|else\\s*:|print\\\
          (|def\\b|return\\b|import\\b|[A-Za-z_]\\w*\\.\\w+\\()\"\n)\nNOTE = \"（这里本来是一段完整或接近完整的代码，已省略。请按上面的思路自己写，写完把代码贴给我，我帮你检查。）\"\
          \n\n\ndef too_complete(code: str) -> bool:\n    lines = [l for l in code.strip().splitlines()\
          \ if l.strip() and not l.strip().startswith(\"#\")]\n    runnable = re.search(r\"\
          \\b(while|for)\\b|print\\(\", code) and len(lines) >= 3\n    # Hand-in-able:\
          \ fewer blanks than the hint prompt requires (one per 2 lines).\n    return\
          \ bool(runnable) and len(BLANK.findall(code)) < max(1, len(lines) // 2)\n\
          \n\ndef unfenced_runs(text: str) -> list[tuple[int, int]]:\n    \"\"\"Line\
          \ ranges [start, end) of 3+ consecutive Python-looking lines outside fences.\"\
          \"\"\n    lines, runs, start = text.split(\"\\n\"), [], None\n    in_fence\
          \ = False\n    for i, line in enumerate(lines + [\"\"]):\n        if line.strip().startswith(\"\
          ```\"):\n            in_fence = not in_fence\n        is_code = not in_fence\
          \ and bool(PY_LINE.match(line.replace(\"　\", \" \")))\n        if is_code\
          \ and start is None:\n            start = i\n        elif not is_code and\
          \ start is not None:\n            if i - start >= 3:\n                runs.append((start,\
          \ i))\n            start = None\n    return runs\n\n\ndef code_blocks(text:\
          \ str) -> list[str]:\n    lines = text.split(\"\\n\")\n    return FENCED.findall(text)\
          \ + [\"\\n\".join(lines[a:b]) for a, b in unfenced_runs(text)]\n\n\ndef\
          \ main(text: str) -> dict:\n    removed = 0\n\n    def hide_fenced(m):\n\
          \        nonlocal removed\n        if too_complete(m.group(1)):\n      \
          \      removed += 1\n            return \"```\\n\" + NOTE + \"\\n```\"\n\
          \        return m.group(0)\n\n    text = FENCED.sub(hide_fenced, text)\n\
          \    lines = text.split(\"\\n\")\n    for a, b in reversed(unfenced_runs(text)):\n\
          \        if too_complete(\"\\n\".join(lines[a:b])):\n            removed\
          \ += 1\n            lines[a:b] = [NOTE]\n    text = \"\\n\".join(lines)\n\
          \    text = re.split(r\"\\n\\**\\s*(参考答案|完整代码|标准答案)\\s*\\**[:：]?\", text)[0].rstrip()\n\
          \    return {\"text\": text, \"removed\": removed}\n"
        code_language: python3
        outputs:
          removed:
            children: null
            type: number
          text:
            children: null
            type: string
        selected: false
        title: 拦截完整代码
        type: code
        variables:
        - value_selector:
          - llm_hint
          - text
          variable: text
