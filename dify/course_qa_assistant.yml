    - data:
        code: "import re\n\nLAB = re.compile(r\"实验任务|实验\\s*\\d|作业|怎么做|怎么写|如何实现|写(一下|个|出)?代码|帮我写|完整代码|答案|源代码|代码生成\"\
          )\n\n\ndef main(query: str) -> dict:\n    # A student who pastes their own\
          \ code wants it checked: normal mode.\n    if \"```\" in query or re.search(r\"\
          (帮我|请)?(检查|看看|改改).*(代码|程序)|我写(完|了)\", query):\n        return {\"mode\"\
          : \"normal\"}\n    return {\"mode\": \"hint\" if LAB.search(query) else\
          \ \"normal\"}\n"
        code_language: python3
        outputs:
          mode:
            children: null
            type: string
        selected: false
        title: 判断是否在要答案
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
      height: 90
      id: route
