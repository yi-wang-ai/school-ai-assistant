        answer: '{{#guard.text#}}'
        selected: false
        title: 输出-提示
        type: answer
        variables: []
      height: 90
      id: answer_hint
      position:
        x: 1880
        y: 120
      positionAbsolute:
        x: 1880
        y: 120
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
